name: Release

# workflow_dispatch -> TestPyPI (a dry run)
# tag v*            -> PyPI (the real thing)
#
# One workflow file rather than two, because PyPI's trusted-publisher
# registration binds to a workflow *filename*: registering `release.yml` on
# both indexes leaves no room for a mismatch. It also means both indexes
# receive artifacts from one build, by one code path.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade build twine

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(python -c "import runpy; print(runpy.run_path('valuekit/_version.py')['__version__'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG version=$VERSION"
          [ "$VERSION" = "$TAG" ] || { echo "::error::tag $TAG does not match __version__ $VERSION"; exit 1; }

      - run: python -m build

      - run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/valuekit
    permissions:
      id-token: write # mandatory for trusted publishing; scoped to this job
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          print-hash: true

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/valuekit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          packages-dir: dist/
          print-hash: true
