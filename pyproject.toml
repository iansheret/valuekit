[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "valuekit"
dynamic = ["version"]
description = "An immutable map for pipeline data, plus disk memoisation for pure functions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ian Sheret", email = "ian.sheret@gmail.com" }]
dependencies = ["numpy>=1.24"]
keywords = [
    "immutable",
    "memoization",
    "caching",
    "pipeline",
    "pure-function",
    "content-addressed",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/iansheret/valuekit"
Repository = "https://github.com/iansheret/valuekit"
Issues = "https://github.com/iansheret/valuekit/issues"
Changelog = "https://github.com/iansheret/valuekit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.dynamic]
version = { attr = "valuekit._version.__version__" }

[tool.setuptools.packages.find]
include = ["valuekit*"]

[tool.setuptools.package-data]
valuekit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
